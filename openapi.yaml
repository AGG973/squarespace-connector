    CreateOrderInput:
      title: CreateOrderInput
      type: object
      description: Matches Squarespace's official CreateOrderRequest contract (reconciled 2026-08-10). Monetary totals are supplied by the caller rather than computed by the API, so they must be internally consistent with lineItems.
      required:
        - channelName
        - createdOn
        - externalOrderReference
        - fulfillments
        - grandTotal
        - lineItems
        - priceTaxInterpretation
        - subtotal
      additionalProperties: false
      properties:
        idempotencyKey:
          type: string
          format: uuid
          description: Sent as the Idempotency-Key request header, not in the body. Optional on this input — the connector generates a fresh UUID when omitted, and reuses the caller's when supplied. Reuse the same key when retrying so a retry cannot create a duplicate order.
        channelName:
          type: string
          maxLength: 30
          description: Sales channel label recorded on the order, e.g. "doo-connector". REQUIRED, max length 30 — confirmed against Squarespace's official CreateOrderRequest contract, 2026-08-10.
        createdOn:
          type: string
          format: date-time
          description: REQUIRED — confirmed against Squarespace's official CreateOrderRequest contract, 2026-08-10. The caller supplies this order-creation timestamp (ISO 8601); it is not computed by the API.
        externalOrderReference:
          type: string
          maxLength: 200
          description: Caller-side identifier for reconciliation. REQUIRED, max length 200 — confirmed against Squarespace's official CreateOrderRequest contract, 2026-08-10.
        fulfillments:
          type: array
          description: REQUIRED — confirmed against Squarespace's official CreateOrderRequest contract, 2026-08-10. Must be present (not omitted); an empty array is valid and expected for a newly created order with no fulfillments yet. Item shape is UNVERIFIED — not needed for typical order creation, so [] is the safe default.
          items: {}
        grandTotal:
          $ref: "#/components/schemas/CreateOrderMoney"
        lineItems:
          type: array
          minItems: 1
          description: REQUIRED, cannot be empty.
          items:
            $ref: "#/components/schemas/CreateOrderLineItemInput"
        priceTaxInterpretation:
          type: string
          enum:
            - EXCLUSIVE
            - INCLUSIVE
          description: "REQUIRED, exactly \"EXCLUSIVE\" or \"INCLUSIVE\" — confirmed against Squarespace's official CreateOrderRequest contract, 2026-08-10. No default: the caller must choose. (Previously modelled with a default of \"EXCLUSIVE\" implying optionality — that was wrong.)"
        customerEmail:
          type: string
          format: email
          description: NOT required — confirmed against Squarespace's official CreateOrderRequest contract, 2026-08-10. (Previously modelled as required — that was wrong.)
        billingAddress:
          $ref: "#/components/schemas/CreateOrderAddress"
        shippingAddress:
          $ref: "#/components/schemas/CreateOrderAddress"
        discountLines:
          type: array
          items:
            type: object
            required:
              - name
              - amount
            properties:
              name:
                type: string
              amount:
                $ref: "#/components/schemas/CreateOrderMoney"
              promoCode:
                type: string
        discountTotal:
          $ref: "#/components/schemas/CreateOrderMoney"
        fulfilledOn:
          type: string
          format: date-time
          description: NOT required. ISO 8601. Distinct from fulfillments (the array) and fulfillmentStatus (the enum) — confirmed against Squarespace's official CreateOrderRequest contract, 2026-08-10.
        fulfillmentStatus:
          $ref: "#/components/schemas/CreateOrderFulfillmentStatus"
        inventoryBehavior:
          type: string
          enum:
            - DECREMENT
            - NONE
          default: NONE
          description: NOT required. UNVERIFIED which value creating the order actually applies by default; whether creating the order draws down stock at all remains unconfirmed.
        shippingLines:
          type: array
          items:
            type: object
            required:
              - method
              - amount
            properties:
              method:
                type: string
              amount:
                $ref: "#/components/schemas/CreateOrderMoney"
        shippingTotal:
          $ref: "#/components/schemas/CreateOrderMoney"
        shopperFulfillmentNotificationBehavior:
          type: string
          enum:
            - SEND
            - SKIP
          description: 'NOT required. CONFIRMED enum, 2026-08-10: exactly "SEND" or "SKIP" — controls whether Squarespace emails the customer a fulfillment notification.'
        subtotal:
          $ref: "#/components/schemas/CreateOrderMoney"
          description: REQUIRED — CONFIRMED live, 2026-08-16. Previously modeled as optional; Squarespace actually returns 400 INVALID_REQUEST_ERROR.unknown, "The sum of lineItems.unitPricePaid.value must equal subtotal.value," when it's omitted. Must be present and equal to the sum of lineItems[].unitPricePaid.value.
        taxTotal:
          $ref: "#/components/schemas/CreateOrderMoney"
    CreateOrderOutput:
      title: CreateOrderResult
      $ref: "#/components/schemas/CreateOrderOrder"
