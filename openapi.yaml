        - quantity
        - isUnlimited
      properties:
        variantId:
          type: string
          format: uuid
        sku:
          type: string
          description: Squarespace-generated SKUs look like SQ1157834, but merchant-set SKUs are free-form, so no pattern is enforced.
        descriptor:
          type: string
          description: Human-readable label, e.g. "Terra chunk [6]" — product name with the variant attributes in brackets.
        quantity:
          type: integer
          minimum: 0
          description: Meaningless when isUnlimited is true.
        isUnlimited:
          type: boolean
    GetOrAdjustInventoryGetInventoryInput:
      title: GetInventoryInput
      type: object
      required:
        - operation
      additionalProperties: false
      properties:
        operation:
          const: get_inventory
        cursor:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          description: "CONFIRMED live, 2026-08-16 — limit:5 against a 51-item inventory returned the same 51 records as no limit at all: byte-identical response, same records, same cursor, hasNextPage:true both times. Same pattern as list_products' confirmed `limit` behavior — this parameter does not reduce Squarespace's page size below its own ~50 default; a smaller requested value is silently ignored. Now confirmed across two separate endpoints (products and inventory), suggesting this may be general Squarespace API behavior rather than something specific to one endpoint. Don't rely on `limit` to control page size below 50; use cursor-based pagination to page through larger inventories."
      dependentSchemas:
        cursor:
          maxProperties: 2
          description: With `operation`, cursor must be the only other parameter.
    GetOrAdjustInventoryGetInventoryOutput:
      title: GetInventoryOutput
      type: object
      required:
        - inventory
        - pagination
      properties:
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/GetOrAdjustInventoryInventoryItem"
        pagination:
          $ref: "#/components/schemas/GetOrAdjustInventoryPagination"
    GetOrAdjustInventoryAdjustInventoryInput:
      title: AdjustInventoryInput
      type: object
      description: "CONFIRMED live, 2026-08-16 — a full incrementOperations/setFiniteOperations round trip against a real variant succeeded and was verified to take effect (see this schema's top-level VERIFICATION STATUS). At least one operation array must be non-empty. Squarespace rejects the request without an Idempotency-Key header — CONFIRMED live, 2026-08-17 (400 Bad Request, RFC 7807 problem+json body, \"Required header 'Idempotency-Key' is not present.\"; the omitted-header call had no side effect, verified via get_inventory before/after) — supplied here as `idempotencyKey` — optional on this input: the connector generates a fresh one when omitted, and reuses the caller's when supplied, so a caller can control retries deliberately."
      required:
        - operation
      additionalProperties: false
      anyOf:
        - required:
            - incrementOperations
          properties:
            incrementOperations: true
        - required:
            - setFiniteOperations
          properties:
            setFiniteOperations: true
        - required:
            - setUnlimitedOperations
          properties:
            setUnlimitedOperations: true
      properties:
        operation:
          const: adjust_inventory
        idempotencyKey:
          type: string
          format: uuid
          description: Sent as the Idempotency-Key request header, not in the body. Optional — the connector generates a fresh UUID when omitted.
        incrementOperations:
          type: array
          minItems: 1
          description: "Adds stock only — quantity must be >= 1. There is no decrement-via-increment: negative quantities are rejected by Squarespace outright (see the `quantity` field note below). To reduce stock, use setFiniteOperations with an absolute target quantity instead."
          items:
            type: object
            required:
              - variantId
              - quantity
            additionalProperties: false
            properties:
              variantId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                description: 'CONFIRMED LIVE — negative values disproven, 2026-08-10: Squarespace responds 400 INVALID_REQUEST_ERROR, "quantity must be between 1 and 1000000000, inclusive." for quantity < 1.'
        setFiniteOperations:
          type: array
          minItems: 1
          description: Absolute stock levels.
          items:
            type: object
            required:
              - variantId
              - quantity
            additionalProperties: false
            properties:
              variantId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 0
        setUnlimitedOperations:
          type: array
          minItems: 1
          description: Switch variants to unlimited stock.
          items:
            type: object
            required:
              - variantId
            additionalProperties: false
            properties:
              variantId:
                type: string
                format: uuid
    GetOrAdjustInventoryAdjustInventoryOutput:
      title: AdjustInventoryOutput
      type: object
      description: "CONFIRMED live, 2026-08-16 — `{ adjusted: true }` was verified to accurately reflect a real write against a real variant (see this schema's top-level VERIFICATION STATUS). Whether the live endpoint answers with this JSON body or with 204 No Content (in which case the connector synthesises this acknowledgement rather than parsing one) was not itself distinguished by that test — either way, the result is confirmed accurate."
