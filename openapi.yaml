    ListOrdersInput:
      title: ListOrdersInput
      type: object
      description: "All fields optional. CONFIRMED live, 2026-08-16, against all four cursor combinations directly (a 56-order store was built to produce a real pagination cursor to test against): cursor + limit succeeds; cursor + modifiedAfter/modifiedBefore and cursor + fulfillmentStatus are both rejected with 400 INVALID_REQUEST_ERROR.INVALID_ARGUMENT, \"Cursor cannot be set while other parameters are present.\" So `cursor` specifically excludes `modifiedAfter`, `modifiedBefore`, and `fulfillmentStatus` — but NOT `limit`. This is narrower than list_products' confirmed rule that cursor must be the only parameter sent; don't assume the two endpoints share the same restriction. Separately, `modifiedAfter` and `modifiedBefore` are CONFIRMED live to require pairing — sending one without the other is rejected with 400 INVALID_REQUEST_ERROR.MISSING_ARGUMENT, \"'modifiedBefore' and 'modifiedAfter' must both be specified.\" (This pairing requirement was previously removed from validation as unconfirmed; live evidence has now reinstated it.)"
      additionalProperties: false
      properties:
        cursor:
          type: string
          minLength: 1
          description: Opaque cursor from a previous response's pagination.nextPageCursor.
        limit:
          type: integer
          minimum: 1
        modifiedAfter:
          type: string
          format: date-time
          description: ISO 8601. May be used alone or alongside modifiedBefore.
        modifiedBefore:
          type: string
          format: date-time
          description: ISO 8601. May be used alone or alongside modifiedAfter.
        fulfillmentStatus:
          $ref: "#/components/schemas/ListOrdersFulfillmentStatus"
      dependentRequired:
        modifiedAfter:
          - modifiedBefore
        modifiedBefore:
          - modifiedAfter
      dependentSchemas:
        cursor:
          description: CONFIRMED live, 2026-08-16 — cursor excludes modifiedAfter, modifiedBefore, and fulfillmentStatus specifically (400 INVALID_REQUEST_ERROR.INVALID_ARGUMENT, "Cursor cannot be set while other parameters are present."). limit is NOT excluded — cursor + limit is confirmed to succeed.
