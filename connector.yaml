provider: squarespace
version: 0.1.0

auth:
  type: api_key
  scheme: bearer
  header: Authorization
  format: "Bearer {api_key}"
  notes: >
    API key is sent as a Bearer token in the Authorization header.
  required_headers:
    - name: User-Agent
      required: true
      applies_to: all_requests
      notes: Squarespace rejects requests that omit this header.

base_urls:
  commerce: https://api.squarespace.com/1.0/commerce/
  contacts: https://api.squarespace.com/v1/contacts
  notes: >
    Commerce (products/orders/inventory) and Contacts are on different API
    versions (1.0 vs v1). Do not conflate their base URLs or assume shared
    request/response conventions.

actions:
  - id: squarespace.list_products
    description: List products in the store catalog.
    kind: read
    request:
      method: GET
      base_url: commerce
      path: /products
    pagination:
      type: cursor

  - id: squarespace.get_or_adjust_inventory
    description: Read current inventory levels or submit an inventory adjustment.
    kind: read_write
    operations:
      - name: get_inventory
        kind: read
        request:
          method: GET
          base_url: commerce
          path: /inventory
      - name: adjust_inventory
        kind: write
        request:
          method: POST
          base_url: commerce
          path: /inventory/adjustments
        required_headers:
          - name: Idempotency-Key
            required: true
        reversible: true
        reversal_notes: An adjustment can be corrected by submitting an opposite adjustment.

  - id: squarespace.list_orders
    description: List orders, filterable by modification time window or fulfillment status.
    kind: read
    request:
      method: GET
      base_url: commerce
      path: /orders
    pagination:
      type: cursor
      alternative: time_range
      time_range_params:
        - modifiedAfter
        - modifiedBefore
    filters:
      - fulfillmentStatus

  - id: squarespace.create_order
    description: Create a new order.
    kind: write
    request:
      method: POST
      base_url: commerce
      path: /orders
    required_headers:
      - name: Idempotency-Key
        required: true
        notes: Squarespace rejects the request outright without this header.
    rate_limit:
      limit: 100
      period: hour
      scope: per_site
    reversible: false
    requires_approval: true

  - id: squarespace.get_contact
    description: Retrieve a single contact record by id.
    kind: read
    request:
      method: GET
      base_url: contacts
      path: /contacts/{id}

error_handling:
  source_shape:
    type: string
    subtype: string
    message: string
    contextId: string
  normalized_shape:
    code: string
    message: string
    httpStatus: integer
    requestId: string
    retryable: boolean
  mapping:
    code: "{type}.{subtype}"
    message: message
    requestId: contextId
    httpStatus: from HTTP response status code
    retryable: "true for 429 and 5xx responses, false otherwise"

risks:
  - Requires Squarespace Core plan or higher for Orders/Inventory/Contacts — currently satisfied by test account
  - list_products' `limit` parameter may not be honored on GET /products — a live test requesting limit:2 against a 4-product catalog returned all 4 products with hasNextPage:false. Inconclusive against this small a catalog (could be a minimum page size instead), but callers should not assume limit reliably caps page size until retested against a larger store.
  - list_orders' cursor-vs-modifiedAfter/modifiedBefore exclusivity rule is enforced in code based on documentation, but has never actually been triggered against the live API — untested, not disproven.

known_limitations:
  - create_order's earlier conclusion here — confirmed platform-level access limitation, restricted to OAuth/registered Extension apps — is DISPROVEN. CONFIRMED live, 2026-08-16 — a real order was successfully created via a personal Developer API Key (order created, $20.00 USD, PAID; no PII recorded here). The actual blocker was never authorization — Squarespace returns 400 INVALID_REQUEST_ERROR.unknown, "The sum of lineItems.unitPricePaid.value must equal subtotal.value," when `subtotal` is omitted. `subtotal` was previously modeled as optional on the request; it is now confirmed functionally required — must be present and equal to the sum of lineItems[].unitPricePaid.value. Schema, action, and tests updated to require it.
  - get_contact's response shape was initially modeled from a placeholder fixture and was substantially wrong. CONFIRMED live, 2026-08-11, against one real contact — the actual response is wrapped in a top-level `contact` key (not flat), uses `primaryEmail.{email, acceptsMarketing}` instead of flat `email`/`transactionalEmailStatus`, and has no `phoneNumbers`/`notes`/`lists`/`tags`/`lastModifiedOn` fields (schema/action/tests updated to match). Because only one real record has been observed, it's unconfirmed whether those absent fields ever appear on contacts that actually have notes, tags, or list memberships set.
  - list_orders' real shape for a populated order object — previously unverified, since the store had zero real orders — is now CONFIRMED live, 2026-08-16, against the real order created earlier that same day. The populated response exactly matches create_order's captured response shape (same fields, same nesting, same line-item shape — see fixtures/create-order-response.json and fixtures/orders.json). Schema ($defs.order/$defs.lineItem in list-orders.schema.json) and fixtures updated to match.
