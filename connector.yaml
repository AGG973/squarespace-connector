provider: squarespace
version: 1.0.0

auth:
  type: api_key
  scheme: bearer
  header: Authorization
  format: "Bearer {api_key}"
  notes: >
    API key is sent as a Bearer token in the Authorization header.
  required_headers:
    - name: User-Agent
      required: true
      applies_to: all_requests
      notes: Squarespace rejects requests that omit this header.

scopes:
  - resource: Products
    access: read
  - resource: Inventory
    access: read_write
  - resource: Orders
    access: read_write
  - resource: Contacts
    access: read

capabilities:
  - All 5 originally-scoped actions are implemented and live-verified against the real API (list_products, get_or_adjust_inventory, list_orders, create_order, get_contact) — see known_limitations for the evidence behind each. A 6th action, list_contacts, was added beyond scope once those five were complete — implemented and unit-tested, reusing the response envelope and per-contact shape already confirmed via get_contact's live testing, but NOT itself live-verified: this endpoint's own cursor behavior has not been exercised against the real API — see known_limitations.
  - MCP server with two transports — stdio for local use (mcp/server.ts, `npm run mcp`) and Streamable HTTP for hosted deployment (`npm start`), guarded by a separate bearer token (MCP_AUTH_TOKEN) from the Squarespace API key.
  - Errors are normalized into a consistent { code, message, httpStatus, requestId, retryable } shape across every action, via a single choke point (squarespaceRequest -> normalizeError) — see error_handling below.
  - Cursor-based pagination is surfaced in the output of every list/read action (list_products, list_orders, get_inventory).
  - Idempotency-Key support (auto-generated if omitted, reused verbatim if supplied) on both write paths (create_order, adjust_inventory) — CONFIRMED live, 2026-08-17, that Squarespace rejects both without it — 400, "Required header 'Idempotency-Key' is not present."
  - Client-side input validation for confirmed live API constraints (e.g. list_orders' cursor-combination and modifiedAfter/modifiedBefore pairing rules, create_order's subtotal requirement) — enforced before a request is sent, not just documented.
  - OpenAPI 3.x spec (openapi.yaml) generated programmatically from the same JSON Schemas that back the MCP tool definitions, so both surfaces share one source of truth.

base_urls:
  commerce: https://api.squarespace.com/1.0/commerce/
  contacts: https://api.squarespace.com/v1/contacts
  notes: >
    Commerce (products/orders/inventory) and Contacts are on different API
    versions (1.0 vs v1). Do not conflate their base URLs or assume shared
    request/response conventions.

actions:
  - id: squarespace.list_products
    description: List products in the store catalog.
    kind: read
    request:
      method: GET
      base_url: commerce
      path: /products
    pagination:
      type: cursor

  - id: squarespace.get_or_adjust_inventory
    description: Read current inventory levels or submit an inventory adjustment.
    kind: read_write
    operations:
      - name: get_inventory
        kind: read
        request:
          method: GET
          base_url: commerce
          path: /inventory
      - name: adjust_inventory
        kind: write
        request:
          method: POST
          base_url: commerce
          path: /inventory/adjustments
        required_headers:
          - name: Idempotency-Key
            required: true
        reversible: true
        reversal_notes: An adjustment can be corrected by submitting an opposite adjustment.

  - id: squarespace.list_orders
    description: List orders, filterable by modification time window or fulfillment status.
    kind: read
    request:
      method: GET
      base_url: commerce
      path: /orders
    pagination:
      type: cursor
      alternative: time_range
      time_range_params:
        - modifiedAfter
        - modifiedBefore
    filters:
      - fulfillmentStatus

  - id: squarespace.create_order
    description: Create a new order.
    kind: write
    request:
      method: POST
      base_url: commerce
      path: /orders
    required_headers:
      - name: Idempotency-Key
        required: true
        notes: Squarespace rejects the request outright without this header.
    rate_limit:
      limit: 100
      period: hour
      scope: per_site
    reversible: false
    requires_approval: true

  - id: squarespace.get_contact
    description: Retrieve a single contact record by id.
    kind: read
    request:
      method: GET
      base_url: contacts
      path: /contacts/{id}

  - id: squarespace.list_contacts
    description: >
      List contacts. A 6th action, beyond the 5 originally scoped above — added
      because the mission board explicitly welcomes extra actions once the
      required five work. Reuses the response envelope and per-contact shape
      already confirmed via get_contact's live testing (see
      src/schemas/get-contact.schema.json's contactListResult $def, which was
      documented specifically for this purpose). This endpoint's own request
      behavior — in particular, whether/how `cursor` combines with other
      parameters — has NOT been tested live; do not assume it matches
      list_products' or list_orders' confirmed cursor rules.
    kind: read
    request:
      method: GET
      base_url: contacts
      path: /contacts
    pagination:
      type: cursor
      notes: >
        UNCONFIRMED — modeled by analogy to list_products/list_orders, not
        tested against this endpoint.

error_handling:
  notes: >
    CONFIRMED live, 2026-08-17 — Squarespace uses at least two distinct
    error response shapes depending on the failure, not just the one
    originally documented. The "original" shape below is Squarespace's
    application-level error format. The "problem_json" shape (RFC 7807
    problem+json) was observed specifically on the missing-Idempotency-Key
    rejection for both create_order and adjust_inventory — 400, "Required
    header 'Idempotency-Key' is not present." — and is likely a
    gateway/edge-level rejection that never reaches Squarespace's
    application-level error formatting, which is why its shape differs.
    normalizeError() in src/errors/normalize.ts (see tests/normalize-error.test.ts)
    detects which shape a given response used — problem_json has no
    contextId, and carries at least one of detail/title/status instead —
    and maps either into the same normalized_shape below.
  source_shapes:
    original:
      type: string
      subtype: string
      message: string
      details: "unknown, optional — present on some responses but not currently mapped into normalized_shape"
      contextId: string
    problem_json:
      type: string
      title: string
      status: integer
      detail: string
      instance: string
  normalized_shape:
    code: string
    message: string
    httpStatus: integer
    requestId: string
    retryable: boolean
  mapping:
    original:
      code: "{type}.{subtype}"
      message: message
      requestId: contextId
    problem_json:
      code: title
      message: detail
      requestId: "not present on this shape — falls back to a generated UUID, same as any other missing-requestId case"
    shared:
      httpStatus: from HTTP response status code
      retryable: "true for 429 and 5xx responses, false otherwise"

risks:
  - Requires Squarespace Core plan or higher for Orders/Inventory/Contacts — re-confirmed 2026-08-17 after an API key rotation to a new account, reported as Core-tier with the same scope grants as the previous one. This connector has no account-info action of its own to independently verify plan tier via the API; this note reflects what was reported at rotation time, not something checked live.

known_limitations:
  - create_order's earlier conclusion here — confirmed platform-level access limitation, restricted to OAuth/registered Extension apps — is DISPROVEN. CONFIRMED live, 2026-08-16 — a real order was successfully created via a personal Developer API Key (order created, $20.00 USD, PAID; no PII recorded here). The actual blocker was never authorization — Squarespace returns 400 INVALID_REQUEST_ERROR.unknown, "The sum of lineItems.unitPricePaid.value must equal subtotal.value," when `subtotal` is omitted. `subtotal` was previously modeled as optional on the request; it is now confirmed functionally required — must be present and equal to the sum of lineItems[].unitPricePaid.value. Schema, action, and tests updated to require it.
  - get_contact's response shape was initially modeled from a placeholder fixture and was substantially wrong. CONFIRMED live, 2026-08-11, against one real contact — the actual response is wrapped in a top-level `contact` key (not flat), uses `primaryEmail.{email, acceptsMarketing}` instead of flat `email`/`transactionalEmailStatus`, and has no `phoneNumbers`/`notes`/`lists`/`tags`/`lastModifiedOn` fields (schema/action/tests updated to match). CONFIRMED live, 2026-08-16, that `tags` and internal notes specifically are excluded from this endpoint's response entirely, not merely absent because the earlier tested contact happened to lack them. Methodology (reproducible) — a real tag ("Test") and note ("test") were added to that same test contact via the Squarespace admin UI, confirmed saved and visible in the dashboard; the contact was then re-fetched via get_contact twice, and both responses were byte-identical to each other and to the pre-tag/note baseline, with no trace of either field before or after. `lists` remains unconfirmed either way — not exercised by this test, so its absence is still only inferred from the one original record.
  - list_orders' real shape for a populated order object — previously unverified, since the store had zero real orders — is now CONFIRMED live, 2026-08-16, against the real order created earlier that same day. The populated response exactly matches create_order's captured response shape (same fields, same nesting, same line-item shape — see fixtures/create-order-response.json and fixtures/orders.json). Schema ($defs.order/$defs.lineItem in list-orders.schema.json) and fixtures updated to match.
  - list_products' `limit` parameter — previously logged as inconclusive — is now CONFIRMED, 2026-08-16, via three live data points — limit:2 on a 4-product catalog → ignored, all 4 products returned, hasNextPage:false; limit:3 on a 10-product catalog → ignored, all 10 products returned, hasNextPage:false; no limit specified on a 51-product catalog → Squarespace applied its own default page size of 50, hasNextPage:true, with a real, usable nextPageCursor returned. CONFIRMED conclusion — `limit` does not reduce Squarespace's page size below its own ~50 default; requesting a smaller value is silently ignored. Pagination itself is fully functional and correctly triggers once the catalog exceeds that default, with a working cursor for subsequent pages. Practical implication for callers — don't rely on `limit` to control page size below 50; to page through more than 50 products, use cursor-based pagination as normal, which is confirmed working.
  - list_orders' cursor paging-combination rules are now CONFIRMED live, 2026-08-16, via all four combinations tested directly against the API (a 56-order store was built specifically to produce a real pagination cursor) — cursor alone → works; cursor + limit → accepted, both succeed together; cursor + modifiedAfter/modifiedBefore (paired) → rejected, 400 INVALID_REQUEST_ERROR.INVALID_ARGUMENT, "Cursor cannot be set while other parameters are present."; cursor + fulfillmentStatus → rejected, same error. CONFIRMED conclusion — cursor specifically excludes modifiedAfter, modifiedBefore, and fulfillmentStatus, but NOT limit; list_products' cursor rule was originally assumed broader still ("cursor must be the only parameter sent") but that assumption has since been disproven too (see below) — don't assume any two endpoints' cursor rules match without testing each directly. A separate, also-confirmed rule surfaced during this same investigation — modifiedAfter and modifiedBefore must both be present or both be absent; sending one without the other is rejected with 400 INVALID_REQUEST_ERROR.MISSING_ARGUMENT, "'modifiedBefore' and 'modifiedAfter' must both be specified." This pairing requirement had previously been removed from validation as unconfirmed; it is now reinstated in assertValidInput and the schema's dependentRequired. Schema ($defs/dependentSchemas/dependentRequired in list-orders.schema.json), action (assertValidInput in list-orders.ts), and tests updated to match — no inferred or unconfirmed language remains for any of these four combinations.
  - get_or_adjust_inventory's read-mode `limit` parameter is now CONFIRMED, 2026-08-16, to be silently ignored, same pattern as list_products — limit:5 against a 51-item inventory (grown from the earlier bulk order testing) returned a byte-identical response to no limit at all — same 51 records, same cursor, hasNextPage:true both times. This is now confirmed across two separate endpoints (products and inventory), suggesting this may be general Squarespace API behavior rather than something specific to one endpoint — a third confirmation on a different endpoint would strengthen that further. Practical implication for callers — don't rely on `limit` to control page size below Squarespace's own ~50 default on either endpoint; use cursor-based pagination as normal.
  - The Idempotency-Key requirement on both write actions was previously asserted without live evidence. Now CONFIRMED live, 2026-08-17, on both — a real adjust_inventory call and a create_order attempt (the latter with a deliberately mismatched subtotal too, guaranteeing no order could be created regardless of outcome) were each sent with the Idempotency-Key header deliberately omitted. Both were rejected identically, before either request body was evaluated (confirmed by the create_order case — the deliberately-wrong subtotal was never reached) — 400 Bad Request, RFC 7807 problem+json shape (not Squarespace's usual `{type, subtype, message, contextId}` error shape), body `{"type":"about:blank","title":"Bad Request","status":400,"detail":"Required header 'Idempotency-Key' is not present.","instance":"/1.0/commerce/<path>"}`. Neither call had any side effect — inventory quantity was verified unchanged before and after, and no order was created. Worth noting separately — this alternate error shape has no `contextId`, so normalizeError() currently falls back to a locally-generated request ID and a generic message for this specific case rather than surfacing Squarespace's actual "Required header..." detail; that's a gap in error normalization, not in this finding.
  - Rate-limit metadata — CONFIRMED live, 2026-08-17, that Squarespace's API exposes none in response headers. A real GET /products response's full header set was inspected (age, cache-control, content-encoding, content-type, date, expires, pragma, server, set-cookie, strict-transport-security, transfer-encoding, vary, x-content-type-options, x-contextid, x-frame-options, x-xss-protection) — no `X-RateLimit-*`, no `Retry-After`, nothing rate-limit-related at all. The only signal Squarespace provides is the 429 status code itself, which this connector already handles (client.ts's fixed 60s cooldown-and-retry). This is a platform limitation, not a gap in this connector's implementation — there is no metadata to surface.
  - list_products' cursor-exclusivity claim ("cursor must be the only parameter") — previously unconfirmed, carried unchanged since this schema's first commit — is now CONFIRMED DISPROVEN live, 2026-08-16. cursor + limit:5 was tested directly against the API, using a real cursor from a 51-product catalog, and succeeded — returned the remaining 1 product from that page, hasNextPage:false, no rejection. The schema's `dependentSchemas` constraint and the matching client-side check in list-products.ts's assertValidInput have both been removed; `limit` is the only other field this input has today, and it's now confirmed to combine safely with cursor. Worth flagging as a pattern, not just a one-off — this connector has now had a "cursor pagination is exclusive" assumption disproven for `limit` on two separate endpoints (list_orders, confirmed via its four-combination test; and list_products, here), and separately had the opposite kind of surprise on list_orders (fulfillmentStatus was assumed compatible with cursor but confirmed excluded). Given that history, treat any future cursor-exclusivity claim in this connector — for any endpoint, for any parameter — as untrustworthy until tested live; don't assume it from general Squarespace API conventions, and don't assume one endpoint's confirmed cursor rule applies to another.
  - list_contacts (added 2026-08-18, beyond the original 5 actions) reuses get_contact's already-confirmed envelope (top-level `contacts` key + `pagination`, per src/schemas/get-contact.schema.json's contactListResult $def) and per-contact shape, and is verified against the one real data point this endpoint itself has produced — a real, empty GET /contacts response (fixtures/contacts.json). What is NOT confirmed is this endpoint's own request-side behavior — `cursor` is modeled by analogy to list_products/list_orders, but per the pattern noted directly above, no two endpoints in this connector have shared the same cursor-combination rules without individual live testing — don't assume list_contacts' cursor behaves like either until it's actually tested against a populated contacts catalog.
